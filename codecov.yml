# The examples program is a demo runner that needs a live MongoDB, so it is compiled by CI but never covered by
# the test suite. Counting it would report the library as a third less tested than it is.
ignore:
  - "examples"
  - "examples/**/*"

coverage:
  status:
    project:
      default:
        target: auto
        threshold: 1%
    patch:
      default:
        informational: true

comment:
  layout: "reach, diff, files"
  require_changes: true
